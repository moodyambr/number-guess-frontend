name: Frontend Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bygg Docker-image (verifierar att Dockerfile fungerar)
        run: docker build -t number-guess-frontend:ci .

      - name: Snabb rök-test av containern
        run: |
          docker run -d --rm -p 8081:8081 -e PORT=8081 \
            -e API_BASE_URL=http://localhost:8080 \
            --name frontend-ci number-guess-frontend:ci
          for i in {1..10}; do
            curl -sf http://localhost:8081/ > /dev/null && exit 0
            [ "$i" = "10" ] && docker logs frontend-ci && exit 1
            sleep 1
          done
          docker stop frontend-ci

  e2e-tests:
    needs: build-image
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      BACKEND_TAG: dev
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Starta mysql + backend + frontend
        run: docker compose -f docker-compose.ci.yml up -d --build --wait

      - name: Vänta tills backend svarar
        run: |
          for i in {1..20}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8080/players \
              -H "Content-Type: application/json" -d '{"username":"ci-healthcheck"}') || status="000"
            [ "$status" = "200" ] && exit 0
            echo "försök $i, status=$status"
            sleep 3
          done
          docker compose -f docker-compose.ci.yml logs backend
          exit 1

      - name: Kör Playwright E2E-tester
        run: npx playwright test --reporter=html
        env:
          E2E_BASE_URL: http://localhost:8081

      - name: Ladda upp testrapport vid fel
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Riv ner miljön
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v
