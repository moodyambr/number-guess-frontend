name: Frontend Tests

# Kör vid push och Pull Request mot dev (och senare main).
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kod
        uses: actions/checkout@v7

      - name: Bygg Docker-image (verifierar att Dockerfile fungerar)
        run: docker build -t number-guess-frontend:ci .

      - name: Snabb rök-test av containern
        run: |
          docker run -d --rm -p 8081:8081 -e PORT=8081 \
            -e API_BASE_URL=http://localhost:8080 \
            --name frontend-ci number-guess-frontend:ci
          for attempt in {1..10}; do
            if curl -sf http://localhost:8081/ > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 10 ]; then
              docker logs frontend-ci
              exit 1
            fi
            sleep 1
          done
          docker stop frontend-ci


  # SKELETT — E2E-jobbet fylls i fullt (Dag 3) när backend-imagen
  # publiceras till Docker Hub. Då hämtas backend + mysql via
  # docker compose och Playwright körs mot hela den riktiga stacken.

  e2e-placeholder:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder — Playwright E2E kommer i Dag 3
        run: 'echo "TODO: docker compose upp (mysql+backend+frontend) + npx playwright test"'
