name: Deploy Frontend (MAIN)

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out project
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/number-guess-frontend:main

      - name: Trigger deployment on Railway (main)
        run: npx -y @railway/cli@latest redeploy --service frontend-main --environment production --yes
        env:
            RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
