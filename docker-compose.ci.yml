services:
  backend:
    image: ${DOCKERHUB_USERNAME}/number-guess-backend:${BACKEND_TAG}
    environment:
      DB_URL: jdbc:mysql://${RAILWAY_DB_HOST}:${RAILWAY_DB_PORT}/${RAILWAY_DB_NAME}?serverTimezone=UTC
      DB_USERNAME: ${RAILWAY_DB_USER}
      DB_PASSWORD: ${RAILWAY_DB_PASSWORD}
      FRONTEND_ORIGIN: http://localhost:8081
      PORT: 8080
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
    depends_on:
      - backend
    environment:
      PORT: 8081
      API_BASE_URL: http://localhost:8080
    ports:
      - "8081:8081"
